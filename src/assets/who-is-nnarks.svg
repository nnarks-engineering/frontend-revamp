<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  {/* Circular Background with Pulse Effect */}
  <circle cx="200" cy="200" r="180" fill="url(#grad1)" fill-opacity="0.05" stroke="url(#grad1)" stroke-width="1" stroke-dasharray="10 10" />
  <circle cx="200" cy="200" r="140" fill="url(#grad1)" fill-opacity="0.1" stroke="url(#grad1)" stroke-width="2" />
  
  {/* The 'N' Brand Mark Stylized */}
  <path d="M120 120 L120 280 L280 120 L280 280" stroke="url(#grad1)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  {/* Connectivity Dots */}
  <circle cx="120" cy="120" r="10" fill="#FFD700" />
  <circle cx="280" cy="280" r="10" fill="#FF8C00" />
  <circle cx="120" cy="280" r="10" fill="#FFD700" />
  <circle cx="280" cy="120" r="10" fill="#FF8C00" />
  
  {/* Geometric Accents */}
  <rect x="180" y="100" width="40" height="4" fill="url(#grad1)" />
  <rect x="180" y="296" width="40" height="4" fill="url(#grad1)" />
</svg>
