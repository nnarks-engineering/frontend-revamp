<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  
  <rect width="400" height="400" fill="url(#grid)" />
  
  {/* Abstract 'Verified Blocks' Illustration */}
  <g opacity="0.8">
    <rect x="100" y="100" width="80" height="80" rx="12" fill="#5ecbe2" fill-opacity="0.1" stroke="#5ecbe2" stroke-width="2"/>
    <path d="M130 140 L140 150 L155 130" stroke="#5ecbe2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <rect x="220" y="140" width="80" height="80" rx="12" fill="#b9e4f1" fill-opacity="0.1" stroke="#b9e4f1" stroke-width="2"/>
    <path d="M250 180 L260 190 L275 170" stroke="#b9e4f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <rect x="140" y="220" width="80" height="80" rx="12" fill="#5ecbe2" fill-opacity="0.1" stroke="#5ecbe2" stroke-width="2"/>
    <path d="M170 260 L180 270 L195 250" stroke="#5ecbe2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  {/* Connecting Lines */}
  <path d="M180 140 L220 180" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <path d="M220 220 L180 260" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
</svg>
